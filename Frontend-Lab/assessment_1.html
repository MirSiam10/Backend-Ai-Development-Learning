<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Text HTML</title>
</head>
<body>
    <form action="thank_you.html">
    <h1>Course Sign Up Page</h1>
    <p> Please Note First Name, Last Name, Password and Email are required fields.</p>


    <label for="firstname">First Name:</label>
   <input type="text" name="firstname" id="firstname" placeholder="Enter your first name" required>

   <label for="lastname">Last Name:</label>
   <input id="lastname" type="text" name="" placeholder="Enter your Last Name" required>
   <br>
    <p></p>
   <label for="email">Email:</label>
   <input id="email", type="email", name="email", placeholder="Enter your email" required>

   <label for="pass">Password:</label>
   <input id="pass", type="password", name="password", placeholder="Enter your Password" required>

   <p>Are you over the age of 18?</p>
   
   <label for="o18">Yes</label>
   <input id="o18" type="radio" name="age" placeholder="">
    <label for="No18">No</label>
   <input id="No18" type="radio" name="age">

   <p>Do you have a Credit Card or Paypal</p>
   <select>
    <option value="Paypal">Paypal</option>
    <option value=""Credit Card>Credit Card</option>
   </select>

   <input type="submit" value="Sign Up" >

</form>



       
</body>
</html>
